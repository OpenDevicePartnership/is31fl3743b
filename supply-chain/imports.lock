[[audits.OpenDevicePartnership.audits.tokio]]
who = "Felipe Balbi <felipe@balbi.sh>"
criteria = "safe-to-run"
version = "1.52.3"
notes = "Async runtime. The existing [[trusted.tokio]] entry covers releases published by user 6741 (Alice Ryhl); this specific 1.52.3 release isn't covered by that trust window so add an explicit audit. tokio's capability surface is broad (process spawn, fs, signal, net) but only what's enabled by features matters: tmp108's dev-dep enables `rt`, `macros`, `rt-multi-thread`, `time` only - no `fs`, `net`, `process`, `signal`. unsafe usage is extensive but expected for an async runtime (intrusive lists, atomics, thread-local state); no build script. Assisted-by: opencode:claude-opus-4.7-1m-internal"
aggregated-from = "https://raw.githubusercontent.com/OpenDevicePartnership/tmp108/refs/heads/main/supply-chain/audits.toml"

[[audits.OpenDevicePartnership.audits.tokio]]
who = "Felipe Balbi <febalbi@microsoft.com>"
criteria = "safe-to-run"
delta = "1.52.3 -> 1.53.1"
notes = """
Async runtime, dev-dependency only (doctests and the async unit tests), so safe-to-run rather than safe-to-deploy. Chains off the full 1.52.3 audit above; only the delta was reviewed here.

build.rs is byte-for-byte identical between the two versions and there are no new dependencies; the only Cargo.toml change beyond the version is the new `schedule-latency` feature, which is empty and gated behind `--cfg tokio_unstable`. Nothing new runs at build or test time.

120 source files change (+2478/-1097), concentrated in runtime/time, runtime/time_alt, the sync primitives (broadcast, mpsc, oneshot, notify, semaphore, watch) and util (linked_list, sharded_list, rand). Four source files are new: io/uring/rename.rs and io/uring/statx.rs, which add filesystem operations behind the `io-uring` feature, and runtime/metrics/schedule_latency{,_mock}.rs behind the unstable `schedule-latency` feature. None of those features are enabled here - tmp108 enables only `rt`, `macros`, `rt-multi-thread` and `time` - and io-uring does not appear in Cargo.lock, so that new capability surface is not reachable from this build.

Assisted-by: opencode:claude-opus-5"""
aggregated-from = "https://raw.githubusercontent.com/OpenDevicePartnership/tmp108/refs/heads/main/supply-chain/audits.toml"

